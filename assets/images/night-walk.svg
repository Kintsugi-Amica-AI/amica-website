<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" role="img" aria-label="Illustration: a woman walking home through a city at dusk while her phone shares her route" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2A1B4E"/>
      <stop offset=".55" stop-color="#6B3A8C"/>
      <stop offset=".85" stop-color="#C35C9A"/>
      <stop offset="1" stop-color="#F29BB8"/>
    </linearGradient>
    <linearGradient id="far" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5A3585"/><stop offset="1" stop-color="#7E4A9E"/></linearGradient>
    <linearGradient id="mid" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3B2466"/><stop offset="1" stop-color="#4E2F7A"/></linearGradient>
    <linearGradient id="near" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#22143C"/><stop offset="1" stop-color="#1A0F2E"/></linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7C4DEB"/><stop offset="1" stop-color="#B84A9C"/></linearGradient>
    <radialGradient id="moonGlow"><stop offset="0" stop-color="#FFE9F3" stop-opacity=".7"/><stop offset="1" stop-color="#FFE9F3" stop-opacity="0"/></radialGradient>
    <radialGradient id="lamp"><stop offset="0" stop-color="#FFE3B8" stop-opacity=".75"/><stop offset="1" stop-color="#FFE3B8" stop-opacity="0"/></radialGradient>
    <radialGradient id="phoneGlow"><stop offset="0" stop-color="#C4B2FF" stop-opacity=".9"/><stop offset="1" stop-color="#C4B2FF" stop-opacity="0"/></radialGradient>
  </defs>
  <rect width="1200" height="520" fill="url(#sky)"/>
  <!-- stars -->
  <g fill="#fff">
    <circle cx="80" cy="60" r="1.6" opacity=".8"/><circle cx="190" cy="120" r="1.2" opacity=".6"/><circle cx="320" cy="44" r="1.8" opacity=".9"/><circle cx="460" cy="96" r="1.1" opacity=".6"/><circle cx="560" cy="36" r="1.5" opacity=".8"/><circle cx="700" cy="80" r="1.2" opacity=".5"/><circle cx="1010" cy="50" r="1.6" opacity=".8"/><circle cx="1120" cy="130" r="1.1" opacity=".6"/><circle cx="640" cy="150" r="1" opacity=".5"/><circle cx="260" cy="180" r="1" opacity=".4"/><circle cx="1150" cy="30" r="1.3" opacity=".7"/><circle cx="410" cy="160" r="1" opacity=".5"/>
  </g>
  <!-- moon -->
  <circle cx="900" cy="110" r="120" fill="url(#moonGlow)"/>
  <circle cx="900" cy="110" r="42" fill="#FFF1F6"/>
  <circle cx="918" cy="98" r="38" fill="#F7D9EA" opacity=".35"/>
  <!-- far skyline -->
  <path fill="url(#far)" opacity=".85" d="M0 330V250h40v-30h50v40h30v-60h60v70h40v-40h50v50h30v-90h70v80h40v-30h60v50h40v-70h50v60h30v-40h70v30h40v-80h60v90h50v-50h60v40h40v-60h60v70h40v-30h60V520H0Z"/>
  <!-- mid skyline with lit windows -->
  <g>
    <path fill="url(#mid)" d="M0 380V300h70v-60h80v80h50v-110h90v120h60v-70h70v90h40v-130h100v140h50v-80h70v60h60v-100h90v110h50v-60h80v70h60v-40h80V520H0Z"/>
    <g fill="#FFD9A8" opacity=".85">
      <rect x="90" y="260" width="8" height="10" rx="1"/><rect x="110" y="280" width="8" height="10" rx="1"/><rect x="130" y="260" width="8" height="10" rx="1"/>
      <rect x="220" y="230" width="8" height="10" rx="1"/><rect x="250" y="250" width="8" height="10" rx="1"/><rect x="220" y="270" width="8" height="10" rx="1"/><rect x="270" y="230" width="8" height="10" rx="1"/>
      <rect x="570" y="210" width="8" height="10" rx="1"/><rect x="600" y="230" width="8" height="10" rx="1"/><rect x="630" y="210" width="8" height="10" rx="1"/><rect x="600" y="270" width="8" height="10" rx="1"/>
      <rect x="880" y="240" width="8" height="10" rx="1"/><rect x="910" y="220" width="8" height="10" rx="1"/><rect x="940" y="260" width="8" height="10" rx="1"/>
      <rect x="1070" y="300" width="8" height="10" rx="1"/><rect x="1100" y="320" width="8" height="10" rx="1"/>
    </g>
    <g fill="#E8C4FF" opacity=".55">
      <rect x="400" y="300" width="8" height="10" rx="1"/><rect x="430" y="280" width="8" height="10" rx="1"/><rect x="740" y="290" width="8" height="10" rx="1"/><rect x="770" y="310" width="8" height="10" rx="1"/><rect x="1010" y="280" width="8" height="10" rx="1"/>
    </g>
  </g>
  <!-- ground / street -->
  <rect y="400" width="1200" height="120" fill="url(#near)"/>
  <rect y="400" width="1200" height="6" fill="#3E2764"/>
  <!-- street lamps -->
  <g>
    <circle cx="240" cy="300" r="110" fill="url(#lamp)" opacity=".7"/>
    <rect x="236" y="300" width="7" height="104" fill="#1A0F2E"/><path d="M220 298h40l-6-12h-28z" fill="#1A0F2E"/><ellipse cx="240" cy="300" rx="14" ry="4" fill="#FFE8C6"/>
    <circle cx="760" cy="300" r="110" fill="url(#lamp)" opacity=".6"/>
    <rect x="756" y="300" width="7" height="104" fill="#1A0F2E"/><path d="M740 298h40l-6-12h-28z" fill="#1A0F2E"/><ellipse cx="760" cy="300" rx="14" ry="4" fill="#FFE8C6"/>
  </g>
  <!-- route line in the street, drawn in the brand gradient -->
  <path d="M40 470 C 260 440 420 480 600 455 S 960 430 1160 450" fill="none" stroke="url(#brand)" stroke-width="5" stroke-dasharray="2 16" stroke-linecap="round" opacity=".95"/>
  <!-- destination pin (home) -->
  <g transform="translate(1100 448)">
    <circle r="26" fill="#B84A9C" opacity=".25"/>
    <path d="M0 0c-14-16-21-25-21-34a21 21 0 0 1 42 0c0 9-7 18-21 34Z" fill="url(#brand)"/>
    <path d="M0-30c-3-3.5-8.5-1.8-8.5 2.4 0 4.2 8.5 9.6 8.5 9.6s8.5-5.4 8.5-9.6c0-4.2-5.5-5.9-8.5-2.4Z" fill="#fff"/>
  </g>
  <!-- the walker: stylised woman silhouette, phone glowing in hand -->
  <g transform="translate(520 270)">
    <circle cx="44" cy="70" r="70" fill="url(#phoneGlow)" opacity=".55"/>
    <!-- shadow -->
    <ellipse cx="20" cy="186" rx="44" ry="7" fill="#000" opacity=".3"/>
    <!-- back leg -->
    <path d="M10 110 L-6 180 L4 182 L22 118Z" fill="#170C27"/>
    <!-- front leg -->
    <path d="M22 110 L44 178 L54 175 L36 108Z" fill="#1F1233"/>
    <!-- shoes -->
    <path d="M-10 179h16l2 6h-20z" fill="#170C27"/><path d="M42 175l14-3 3 6-16 3z" fill="#1F1233"/>
    <!-- coat / body -->
    <path d="M4 40 C 0 70 -4 100 -8 122 L 44 122 C 38 98 34 70 32 40 C 28 32 10 32 4 40Z" fill="#2B1845"/>
    <!-- bag strap + bag -->
    <path d="M8 40 L 36 92" stroke="#150A24" stroke-width="3"/><rect x="30" y="86" width="20" height="18" rx="4" fill="#150A24"/>
    <!-- back arm -->
    <path d="M6 46 C -6 66 -8 84 -4 98" stroke="#2B1845" stroke-width="9" stroke-linecap="round" fill="none"/>
    <!-- front arm holding phone -->
    <path d="M28 46 C 38 62 46 70 56 70" stroke="#2B1845" stroke-width="9" stroke-linecap="round" fill="none"/>
    <!-- phone -->
    <rect x="54" y="58" width="10" height="17" rx="2.5" fill="#C4B2FF"/>
    <rect x="55.5" y="60" width="7" height="12" rx="1.5" fill="#fff" opacity=".9"/>
    <!-- head + hair -->
    <path d="M6 10 C 2 26 0 40 -6 50 C 4 46 10 40 12 30Z" fill="#170C27"/>
    <circle cx="20" cy="18" r="14" fill="#3A2254"/>
    <path d="M6 18 C 6 2 30 -2 34 14 C 30 8 20 6 12 12 C 10 20 10 26 6 30Z" fill="#170C27"/>
  </g>
  <!-- floating status chip -->
  <g transform="translate(610 190)">
    <rect width="210" height="46" rx="23" fill="#fff" opacity=".92"/>
    <circle cx="26" cy="23" r="6" fill="#2F6A4D"/>
    <text x="42" y="28.5" font-family="Public Sans, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#2B1B3A">Circle can see you</text>
  </g>
  <g transform="translate(900 360)">
    <rect width="176" height="46" rx="23" fill="#fff" opacity=".92"/>
    <text x="22" y="28.5" font-family="Public Sans, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#6D3FC9">Home in 18 min</text>
  </g>
</svg>
